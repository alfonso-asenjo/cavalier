# Publica la web (introducción histórica + partidas de ejemplo) en GitHub Pages.
# Activar una vez en el repositorio: Settings → Pages → Source: «GitHub Actions».
name: Web

on:
  push:
    branches: [main]
    paths: ["data/intro/**", "data/photos/**", "examples/**", "scenarios/**", "src/cavalier/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: cavalier site --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
