"del líder insular" = "de Castro"
"al líder insular" = "a Castro"
"el líder insular" = "Castro"
"el Secretario de la Asamblea" = "U Thant"
"Asamblea de Naciones" = "ONU"
"de la Federación Atlántica" = "de Estados Unidos"
