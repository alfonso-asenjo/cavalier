<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cavalier · relato de una partida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root {
  --board: #d9dedb;      /* panel de las fotos de reconocimiento */
  --paper: #f6f7f5;
  --ink: #1e2427;
  --ink-soft: #4d575b;
  --rule: #b7bfbc;
  --usa: #2c5a85;
  --ussr: #9e2f28;
  --heat: #d08a12;
  --calm: #5c8a6e;
  --display: "Archivo", "Arial Narrow", sans-serif;
  --text: "Source Serif 4", Georgia, serif;
  --gutter: 112px;
  --news: #efe9da; --news-ink: #191714; --manila: #e8dab4; --manila-ink: #2a241a; --stamp: #b3261e;
  --mono: "Courier Prime", "Courier New", monospace; --old: "Old Standard TT", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --board: #1b2124; --paper: #242b2e; --ink: #e6eae8; --ink-soft: #a9b3b0; --rule: #3b4549;
    --usa: #79a6d2; --ussr: #e0786e; --heat: #e6a43a; --calm: #8cbf9f;
    --news: #2b2925; --news-ink: #ece6d6; --manila: #3a3426; --manila-ink: #efe4c4; --stamp: #e0574d;
  }
}
:root[data-theme="dark"] {
  --board: #1b2124; --paper: #242b2e; --ink: #e6eae8; --ink-soft: #a9b3b0; --rule: #3b4549;
  --usa: #79a6d2; --ussr: #e0786e; --heat: #e6a43a; --calm: #8cbf9f;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--board); color: var(--ink); font: 400 clamp(17px, 0.4vw + 12px, 20px)/1.6 var(--text); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--heat); outline-offset: 2px; }
.usa { color: var(--usa); }
.ussr { color: var(--ussr); }

/* ── Portada: primera plana (periódico ficticio) ── */
.front { background: var(--news); color: var(--news-ink); padding: clamp(18px, 3vw, 34px) clamp(16px, 5vw, 72px) 28px; border-bottom: 1px solid var(--rule);
  background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 3px 3px; }
.front > div { max-width: 1240px; margin: 0 auto; }
.front .mast { text-align: center; border-bottom: 4px double currentColor; padding-bottom: 8px; }
.front .mast h2 { font: 700 clamp(30px, 5.6vw, 66px)/1 var(--old); letter-spacing: .02em; margin: 0; }
.front .mast .line { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 700 12.5px/1.2 var(--display); font-stretch: 85%; letter-spacing: .14em; text-transform: uppercase; border-top: 1px solid currentColor; margin-top: 8px; padding-top: 6px; }
.front .extra { text-align: center; font: 800 14px var(--display); letter-spacing: .4em; color: var(--stamp); margin: 12px 0 0; }
.front h1 { text-align: center; font: 800 clamp(44px, 8.6vw, 120px)/.9 var(--display); font-stretch: 62%; text-transform: uppercase; letter-spacing: -.005em; margin: 8px 0 12px; text-wrap: balance; }
.front .deck { text-align: center; font: italic 400 clamp(19px, 2.2vw, 26px)/1.35 var(--old); max-width: 52ch; margin: 0 auto 18px; }
.front .cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; border-top: 1px solid currentColor; padding-top: 16px; }
.front figure { margin: 0; }
.front figure img { width: 100%; max-height: 420px; object-fit: cover; filter: grayscale(1) contrast(1.15); display: block; }
.front figcaption { font: 400 13px/1.4 var(--old); margin-top: 6px; }
.front .lead { font: 400 17px/1.55 var(--old); column-count: 1; }
.front .lead p { margin: 0 0 10px; text-align: justify; hyphens: auto; }
.front .lead p:first-child::first-letter { font: 700 3.1em/.8 var(--old); float: left; padding: 4px 6px 0 0; }
.front .lead a { font: 700 15px var(--display); letter-spacing: .06em; text-transform: uppercase; }
@media (max-width: 760px) { .front .cols { grid-template-columns: 1fr; } }

/* ── Ficha: hoja de control de un expediente desclasificado ── */
.dossier { padding: 30px clamp(16px, 5vw, 72px); background: var(--board); }
.dossier .sheet { position: relative; max-width: 1240px; margin: 0 auto; background: var(--manila); color: var(--manila-ink); font: 400 15px/1.5 var(--mono); padding: 14px 22px 20px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.dossier .cls { text-align: center; font: 700 15px var(--mono); letter-spacing: .3em; color: var(--stamp); border-top: 2px solid var(--stamp); border-bottom: 2px solid var(--stamp); padding: 3px 0; margin: 0 0 12px; }
.dossier .cls.bottom { margin: 14px 0 0; }
.dossier .hd { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: 700; text-transform: uppercase; border-bottom: 1px dashed currentColor; padding-bottom: 8px; margin-bottom: 10px; }
.dossier dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 26px; margin: 0; }
.dossier dl div { border-bottom: 1px solid rgba(0,0,0,.25); padding: 4px 0 6px; }
.dossier dt { font: 700 11.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
.dossier dd { margin: 2px 0 0; font: 700 22px/1.15 var(--mono); }
.dossier .stamp { position: absolute; right: 6%; top: -22px; background: color-mix(in srgb, var(--manila) 60%, transparent); transform: rotate(-9deg); font: 700 clamp(18px, 2.6vw, 30px) var(--mono); letter-spacing: .14em; color: var(--stamp); border: 4px double var(--stamp); padding: 4px 14px; opacity: .78; mix-blend-mode: multiply; pointer-events: none; }
@media (max-width: 640px) { .dossier .stamp { position: static; display: inline-block; margin: 0 0 10px; transform: rotate(-4deg); } }

/* ── Cuerpo: sismógrafo + capítulos + panel ── */
.story { display: grid; grid-template-columns: var(--gutter) minmax(0, clamp(640px, 52vw, 920px)) clamp(280px, 20vw, 340px); gap: 0 clamp(28px, 3vw, 52px); justify-content: center; padding: 48px 16px 24px; }
.trace { position: relative; grid-column: 1; }
.trace svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chapters { grid-column: 2; }
.rail { grid-column: 3; }
.rail .sticky { position: sticky; top: calc(var(--navh, 0px) + var(--barh, 0px) + 16px); background: var(--paper); border: 1px solid var(--rule); padding: 18px 18px 14px; }

.chapter { position: relative; padding: 0 0 56px; scroll-margin-top: calc(var(--navh, 0px) + var(--barh, 0px) + 16px); }
.chapter .when { font: 700 13.5px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 6px; border-top: 1px solid var(--rule); padding-top: 8px; }
.chapter .when b { color: var(--ink); font-weight: 700; }
.chapter h2 { font: 750 clamp(28px, 3.6vw, 40px)/1.05 var(--display); font-stretch: 72%; margin: 0 0 14px; text-wrap: balance; }
.chapter.key h2 { font-size: clamp(32px, 4.4vw, 50px); }
.chapter p { margin: 0 0 14px; }
.chapter .quiet h2 { font-size: 26px; }

figure { margin: 18px 0 20px; }
figure img { display: block; width: 100%; height: auto; max-height: 440px; object-fit: cover; filter: grayscale(1) contrast(1.05); background: var(--rule); }
figcaption { font: 400 14px/1.4 var(--display); font-stretch: 90%; color: var(--ink-soft); margin-top: 6px; }

blockquote { position: relative; margin: 20px 0; padding: 2px 0 2px 84px; border-left: 0; min-height: 64px; }
blockquote .face { position: absolute; left: 0; top: 2px; width: 64px; height: 64px; border-radius: 50%; object-fit: cover; object-position: 50% 22%; filter: grayscale(1) contrast(1.1); border: 3px solid currentColor; background: var(--rule); }
blockquote .face.ini { display: grid; place-items: center; font: 800 22px var(--display); color: currentColor; background: var(--paper); }
blockquote .who { font: 700 15px/1.2 var(--display); font-stretch: 85%; margin: 0 0 6px; }
blockquote .said { font: italic 400 19px/1.55 var(--text); color: var(--ink); margin: 0; max-width: 60ch; }
blockquote audio { display: block; width: 100%; max-width: 340px; height: 32px; margin-top: 8px; }

details.more > summary { cursor: pointer; font: 600 15px var(--display); font-stretch: 85%; color: var(--ink-soft); margin: -4px 0 12px; }
details.inside { margin-top: 8px; border-top: 1px solid var(--rule); }
details.inside > summary { cursor: pointer; padding: 10px 0; font: 650 16px var(--display); font-stretch: 85%; color: var(--ink-soft); list-style: none; }
details.inside > summary::-webkit-details-marker { display: none; }
details.inside > summary::before { content: "+"; display: inline-block; width: 1.2em; font-weight: 800; }
details.inside[open] > summary::before { content: "−"; }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 15px; line-height: 1.5; }
.side h3 { font: 700 18px var(--display); font-stretch: 80%; margin: 0 0 6px; }
.side h4 { font: 600 14px var(--display); font-stretch: 85%; color: var(--ink-soft); margin: 14px 0 4px; }
.side ul { margin: 0; padding-left: 18px; }
.side li { margin: 0 0 4px; }
.side .reason { font-style: italic; margin: 0; }
.gap { font: 600 13px var(--display); }
.gap.off { color: var(--heat); }
.world { margin-top: 16px; font-size: 15px; }
.world h4 { font: 600 14px var(--display); font-stretch: 85%; color: var(--ink-soft); margin: 0 0 4px; }
.world ul { margin: 0; padding-left: 18px; }
.false { font: 700 12px var(--display); color: var(--ussr); margin-left: 6px; }
.fallback { font: 700 12px var(--display); color: var(--heat); }

/* ── Panel fijo ── */
.rail .sticky { background: linear-gradient(#3c4136, #2c3028); color: #e5e2cf; border: 2px solid #1b1d17; border-radius: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 6px 18px rgba(0,0,0,.3); }
.rail h3 { font: 800 12px/1.2 var(--display); letter-spacing: .2em; text-transform: uppercase; margin: 0 0 2px; color: #e5e2cf; }
.rail .now { font: 700 12.5px/1.3 var(--mono); letter-spacing: .04em; color: #ffcf6a; margin: 0 0 10px; text-transform: uppercase; }
.gauge { display: block; width: 100%; height: auto; margin: 0 0 8px; }
.gauge .face { fill: #f1ead2; stroke: #15160f; stroke-width: 3; }
.gauge text { font: 700 10px var(--display); fill: #2a2a22; }
.gauge .lbl { font: 800 11px var(--display); letter-spacing: .2em; }
.gauge .needle { transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); transform-origin: 100px 100px; }
.boards { display: grid; gap: 8px; margin: 0 0 12px; }
.board .bl { display: flex; justify-content: space-between; font: 800 10.5px var(--display); letter-spacing: .16em; text-transform: uppercase; margin-bottom: 3px; }
.board .wins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: #111; padding: 4px; border-radius: 3px; box-shadow: inset 0 2px 4px rgba(0,0,0,.8); }
.board .wins span { text-align: center; font: 700 15px/26px var(--mono); color: #4b4436; background: #211d17; border-radius: 2px; }
.board .wins span.on { color: #1a1206; background: radial-gradient(circle at 50% 40%, #ffe9a8, #ffb22e 70%); box-shadow: 0 0 10px #ffa21f; }
.board .wins span.on.d2, .board .wins span.on.d1 { background: radial-gradient(circle at 50% 40%, #ffd2c4, #ff4a2a 70%); box-shadow: 0 0 12px #ff3b1f; color: #2a0700; }
.status { list-style: none; margin: 0; padding: 0; font: 600 12.5px/1.35 var(--display); font-stretch: 90%; }
.status li { display: flex; gap: 8px; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.1); }
.status li::before { content: ""; flex: 0 0 11px; height: 11px; margin-top: 2px; border-radius: 50%; border: 2px solid #111; background: #3a2a1a; }
.status li.yes::before { background: radial-gradient(circle at 35% 35%, #fff6c8, #ffb02e 50%, #c46a00); box-shadow: 0 0 7px #ffa21f; }
.status li.good::before { background: radial-gradient(circle at 35% 35%, #eaffd8, #7ee05a 50%, #2c8a1c); box-shadow: 0 0 7px #6ddc49; }
.rail .deals { margin-top: 10px; font: 400 12.5px/1.4 var(--mono); color: #d8d3bb; background: rgba(0,0,0,.25); padding: 6px 8px; border-radius: 2px; }

/* ── Cierre ── */
.ending { background: var(--paper); border-top: 1px solid var(--rule); padding: 48px clamp(16px, 5vw, 72px); }
.ending > div { max-width: 760px; margin: 0 auto; }
.ending h2 { font: 800 clamp(30px, 4vw, 44px)/1.05 var(--display); font-stretch: 70%; margin: 0 0 14px; }
.ending .notes { font: 400 14px/1.5 var(--display); font-stretch: 92%; color: var(--ink-soft); margin-top: 28px; }
.ending .notes p { margin: 0 0 8px; }

/* ── Antecedentes: lo que ocurrió de verdad antes del primer turno ── */
.chapter.prologue { background: var(--manila); color: var(--manila-ink); padding: 18px 22px 22px; margin-bottom: 48px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
.prologue .when { border-top: 0; padding-top: 0; color: var(--stamp); }
.prologue h2 { font-size: clamp(26px, 3vw, 36px); }
.prologue ol { list-style: none; margin: 10px 0 0; padding: 0; font: 400 16px/1.5 var(--text); }
.prologue li { padding: 8px 0; border-top: 1px dashed rgba(0,0,0,.25); }
.prologue li .d { font: 700 13px var(--mono); letter-spacing: .06em; text-transform: uppercase; display: block; }
.prologue li.danger .d { color: var(--stamp); }
.prologue li b { font-family: var(--display); font-stretch: 85%; }
.prologue .begin { margin: 16px 0 0; text-align: center; font: 700 14px var(--mono); letter-spacing: .24em; color: var(--stamp); border-top: 2px solid var(--stamp); border-bottom: 2px solid var(--stamp); padding: 6px 0; }

/* ── Barra de la web y estado en directo ── */
.topnav { position: sticky; top: 0; z-index: 10; display: flex; gap: 18px; align-items: center; padding: 10px clamp(16px, 5vw, 72px); background: #141a1c; color: #e6eae8; font: 600 15px/1.2 var(--display); font-stretch: 85%; }
.topnav a { text-decoration: none; opacity: .85; }
.topnav a:hover { opacity: 1; text-decoration: underline; }
.topnav .brand { font-weight: 800; letter-spacing: .04em; margin-right: auto; opacity: 1; }
.live { display: inline-flex; align-items: center; gap: 8px; }
.live::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--heat); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
.waiting { max-width: 680px; margin: 0 auto; padding: 48px 16px; font: 500 18px/1.5 var(--display); }
.chapter.thinking { color: var(--ink-soft); }
.advice { margin: 4px 0 18px; padding: 10px 14px; background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid currentColor; font: 500 15px/1.4 var(--display); font-stretch: 92%; }
.advice .who { font-weight: 700; margin: 0 0 6px; }
.advice ul { list-style: none; margin: 0; padding: 0; color: var(--ink); }
.advice li { padding: 3px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.advice li img, .advice li .mini { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; object-position: 50% 22%; filter: grayscale(1); border: 2px solid currentColor; flex: none; }
.advice li .mini { display: inline-grid; place-items: center; font: 800 11px var(--display); background: var(--board); }
.advice li b { font-weight: 700; }
.advice .rec { color: var(--ink-soft); }
.advice .ok { font: 700 12px var(--display); color: var(--calm); }
.advice .no { font: 700 12px var(--display); color: var(--ink-soft); }
.advice details { margin-top: 6px; }
.advice details summary { cursor: pointer; color: var(--ink-soft); font-weight: 600; }
.advice details p { margin: 6px 0 0; font: 400 15px/1.5 var(--text); }

/* ── Barra de fechas: los días de la crisis, siempre a la vista ── */
.datebar { position: sticky; top: var(--navh, 0px); z-index: 9; background: var(--paper); border-bottom: 1px solid var(--rule); padding: 6px clamp(16px, 5vw, 72px) 4px; }
.datebar .track { position: relative; height: 46px; cursor: pointer; }
.datebar .day { position: absolute; top: 0; bottom: 14px; border-left: 1px solid var(--rule); font: 600 11.5px/1 var(--display); font-stretch: 85%; color: var(--ink-soft); padding: 2px 0 0 3px; white-space: nowrap; }
.datebar .day.wk { color: var(--ink); }
.datebar .real, .datebar .played { position: absolute; bottom: 4px; height: 10px; }
.datebar .real { background: repeating-linear-gradient(135deg, var(--rule) 0 4px, transparent 4px 8px); }
.datebar .played { background: var(--heat); opacity: .85; }
.datebar .hist { position: absolute; bottom: 15px; width: 9px; height: 9px; margin-left: -4.5px; background: var(--ink); transform: rotate(45deg); }
.datebar .now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ussr); transition: left .25s; }
.datebar .now span { position: absolute; top: 0; left: 6px; font: 700 11.5px/1 var(--display); font-stretch: 85%; color: var(--ussr); background: var(--paper); padding: 1px 3px; white-space: nowrap; }
.datebar .now.flip span { left: auto; right: 6px; }
.datebar .key { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 500 12px/1.3 var(--display); font-stretch: 90%; color: var(--ink-soft); margin-top: 2px; }
.datebar .key i { display: inline-block; vertical-align: -1px; margin-right: 5px; }
.minimap { margin: 18px 0 20px; background: var(--paper); border: 1px solid var(--rule); }
.minimap svg { display: block; width: 100%; height: auto; max-height: 320px; margin: 0 auto; }
.minimap .sea { fill: color-mix(in srgb, var(--usa) 7%, var(--paper)); }
.minimap .land { fill: var(--board); stroke: var(--rule); stroke-width: .8; }
.minimap .land.cuba { fill: color-mix(in srgb, var(--heat) 18%, var(--board)); stroke: var(--ink-soft); }
.minimap .q { fill: none; stroke: var(--usa); stroke-width: 3; stroke-dasharray: 10 7; }
.minimap .pt circle { fill: var(--ussr); stroke: var(--paper); stroke-width: 2; }
.minimap .pt.incidente circle { fill: var(--heat); } .minimap .pt.ciudad circle { fill: var(--ink-soft); }
.minimap .pt text { font: 650 15px var(--display); font-stretch: 88%; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
.minimap figcaption { padding: 6px 10px 8px; margin: 0; }
@media (max-width: 640px) { .datebar .day:not(.lbl) { font-size: 0; } .datebar .key { display: none; } }

/* ── Móvil: el panel se convierte en una franja fija ── */
@media (max-width: 1100px) {
  .story { grid-template-columns: 56px minmax(0, 1fr); gap: 0 16px; padding-top: 0; }
  .rail { grid-column: 1 / -1; grid-row: 1; position: sticky; top: calc(var(--navh, 0px) + var(--barh, 0px)); z-index: 5; margin: 0 -16px 28px; }
  .rail .sticky { position: static; border-radius: 0; padding: 8px 16px; display: grid; grid-template-columns: 110px 1fr; gap: 4px 14px; align-items: center; }
  .rail h3, .rail .status, .rail .deals { display: none; }
  .rail .now { grid-column: 1 / -1; margin: 0; }
  .gauge { grid-row: 2; margin: 0; }
  .boards { margin: 0; }
  .trace, .chapters { grid-row: 2; }
}
@media (max-width: 640px) {
  body { font-size: 17px; }
  .sides { grid-template-columns: 1fr; }
  .rail .sticky { grid-template-columns: 90px 1fr; }
}
</style>
</head>
<body>
<nav class="topnav" id="topnav" hidden></nav>
<div class="datebar" id="datebar" hidden></div>
<header class="front" id="top"></header>
<section class="dossier" aria-label="Ficha de la partida" id="facts"></section>
<main class="story">
  <div class="trace" aria-hidden="true"><svg id="trace"></svg></div>
  <div class="chapters" id="chapters"></div>
  <aside class="rail" aria-label="Estado en el turno visible"><div class="sticky" id="rail"></div></aside>
</main>
<section class="ending" id="ending"></section>

<script>
let DATA = /*__DATA__*/null;
let C, T, V, P;  // catálogo, turnos, voces y fotos de la partida que se muestra (en directo, se recargan)
const LIVE = !DATA && new URLSearchParams(location.search).get("id");
const SIDES = ["USA", "USSR"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const cls = s => s.toLowerCase();
const leader = s => s ? ((C.sides[s] || {}).leader || s).split(" ").slice(-1)[0] : "";
const country = s => ({USA: "EE. UU.", USSR: "la URSS"})[s] || s;
const termLabel = k => C.terms[k] || k;
const actLabel = k => (C.actions[k] || {}).label || k;
const stance = k => (C.actions[k] || {}).stance || "neutral";
const lowerFirst = s => s ? s[0].toLowerCase() + s.slice(1) : s;
const OUTCOME = {
  acuerdo_negociado: ["Hay acuerdo, y se cumple", "Los dos bandos firman, cumplen y verifican lo pactado."],
  desescalada: ["La crisis se desactiva", "La tensión baja y se mantiene baja: nadie gana, nadie dispara."],
  sin_resolver: ["Se acaba el tiempo sin acuerdo", "La partida termina con los misiles en su sitio y la tensión al límite."],
  conflicto_convencional: ["Empieza la guerra", "Una acción militar abre un conflicto convencional."],
  uso_nuclear: ["Se cruza el umbral nuclear", "Se usa, o se pierde el control de, un arma nuclear. La simulación termina aquí."],
};

/* ── Caras: retrato de cada líder y asesor (data/photos) ── */
function faceSrc(key) {
  const file = key === "USA" ? "kennedy_1.jpg" : key === "USSR" ? "jrushchov_1.jpg" : `persona_${key}.jpg`;
  for (const list of Object.values(P)) for (const ph of list) if (ph.file === file) return ph.src;
  return null;
}
function face(key, label, cls) {
  const src = faceSrc(key);
  const ini = String(label || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2);
  return src ? `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy">` : `<span class="${cls} ini" aria-hidden="true">${esc(ini)}</span>`;
}

/* ── Fotos por tipo de momento ── */
let photoUse = {};
function photo(cat) {
  const list = P[cat];
  if (!list || !list.length) return null;
  const n = photoUse[cat] = (photoUse[cat] ?? -1) + 1;
  return list[n % list.length];
}
function figure(ph) {
  if (!ph) return "";
  return `<figure><img src="${ph.src}" alt="${esc(ph.caption)}" loading="lazy"><figcaption>${esc(ph.caption)} Foto: ${esc(ph.credit)}.</figcaption></figure>`;
}
/* ── Mapas: dónde ocurrió de verdad lo que pasa en este turno ── */
const SITES = ["san_cristobal", "guanajay", "sagua", "remedios"];
const mapUse = new Set();
function mapFocus(t) {
  const ev = t.events || [], kinds = SIDES.flatMap(s => actionsOf(t, s).map(a => a.kind));
  const inc = ev.filter(e => e.kind === "incident").map(e => e.description).join(" ");
  if (/derribad/i.test(inc)) return ["banes", ["banes"], "Dónde ocurrió en la realidad: el 27 de octubre, un misil soviético derribó cerca de Banes el U-2 del mayor Rudolf Anderson."];
  if (/submarino/i.test(inc)) return ["cuarentena", ["cuarentena"], "La línea de cuarentena (aproximada). Allí, el 27 de octubre, los destructores estadounidenses obligaron a emerger al submarino soviético B-59, que llevaba un torpedo nuclear."];
  if (/antiaére/i.test(inc)) return ["sitios", SITES, "Las bases de misiles soviéticos que sobrevolaban a baja altura los aviones de reconocimiento estadounidenses."];
  if (kinds.some(k => ["air_strike", "invasion"].includes(k))) return ["ataque", [...SITES, "habana"], "Los objetivos de un ataque: las bases de misiles soviéticos en Cuba, a unos 150 km de Florida."];
  if (kinds.some(k => ["impose_quarantine", "run_quarantine"].includes(k))) return ["cuarentena", ["cuarentena"], "La línea de cuarentena naval, a unas 500 millas náuticas de Cuba (aproximada)."];
  return null;
}
function miniMap(t) {
  const M = DATA.map, f = M && mapFocus(t);
  if (!f || mapUse.has(f[0])) return "";
  mapUse.add(f[0]);
  const show = new Set(f[1]);
  const pts = M.places.filter(q => show.has(q.id) || ["habana", "miami"].includes(q.id));
  const lbl = q => q.label.replace(/^Banes:.*/, "Banes");
  const right = new Set(["guanajay", "habana", "sagua", "remedios", "miami", "banes"]);
  return `<figure class="minimap"><svg viewBox="0 0 ${M.w} ${M.h}" role="img" aria-label="${esc(f[2])}">
    <rect class="sea" width="${M.w}" height="${M.h}"/>${M.lands.map(l => `<path class="land${l.cuba ? " cuba" : ""}" d="${l.d}"/>`).join("")}
    ${show.has("cuarentena") ? `<path class="q" d="${M.quarantine}"/>` : ""}
    ${pts.map(q => `<g class="pt ${esc(q.kind)}"><circle cx="${q.x}" cy="${q.y}" r="${q.kind === "ciudad" ? 5 : 9}"/><text x="${q.x + (right.has(q.id) ? 12 : -12)}" y="${q.y + (q.id === "guanajay" ? -10 : q.id === "remedios" ? 20 : 5)}" text-anchor="${right.has(q.id) ? "start" : "end"}">${esc(lbl(q))}</text></g>`).join("")}
  </svg><figcaption>${esc(f[2])} Mapa: ${esc(M.source)}.</figcaption></figure>`;
}

function incidentCategory(text) {
  if (/submarino/i.test(text)) return "submarino";
  if (/reconocimiento|avión|aviones|antiaére/i.test(text)) return "reconocimiento";
  if (/buques|cuarentena/i.test(text)) return "bloqueo";
  if (/radar|alerta|movilizaci/i.test(text)) return "alerta";
  if (/invasión/i.test(text)) return "misiles";
  return "alerta";
}

/* ── Qué pasó en cada turno, contado ── */
function actionsOf(t, side) { return ((t.decisions || {})[side] || {}).actions || []; }
function prevState(i) { return i > 0 ? T[i - 1].state : null; }

function chapter(t, i) {
  const ev = t.events || [];
  const prev = prevState(i);
  const outcome = ev.find(e => e.kind === "outcome");
  const incidents = ev.filter(e => e.kind === "incident");
  const intel = ev.filter(e => e.kind === "intel");
  const deals = ev.filter(e => e.kind === "deal");
  const accepted = deals.find(e => /aceptado/i.test(e.description));
  const fulfilled = deals.filter(e => /^(Cumplido|Verificado)/.test(e.description));
  const proposed = deals.find(e => /enviada/i.test(e.description));
  const rejected = deals.find(e => /rechazada/i.test(e.description));
  const defconMoves = SIDES.filter(s => prev && t.state.sides[s].defcon !== prev.sides[s].defcon);
  const hard = SIDES.flatMap(s => actionsOf(t, s).filter(a => ["escalate", "terminal"].includes(stance(a.kind))).map(a => [s, a]));
  const soft = SIDES.flatMap(s => actionsOf(t, s).filter(a => stance(a.kind) === "deescalate" && !["restrain_forces"].includes(a.kind)).map(a => [s, a]));

  let title, cat = null, key = false;
  if (outcome) { title = OUTCOME[t.state.outcome]?.[0] || outcome.description; key = true;
    cat = t.state.outcome === "acuerdo_negociado" ? "retirada" : t.state.outcome === "sin_resolver" ? "misiles" : "alerta"; }
  else if (incidents.length) { title = incidents[0].description; key = true; cat = incidentCategory(title); }
  else if (accepted) { title = `${accepted.actor ? leader(accepted.actor) + " acepta" : "Se acepta"} la propuesta ${accepted.description.match(/P\d+/)?.[0] || ""}`; key = true; cat = "onu"; }
  else if (fulfilled.length) { title = "Se cumple: " + lowerFirst(fulfilled[0].description.replace(/^(Cumplido|Verificado):\s*/, "")); cat = "retirada"; }
  else if (proposed) { title = `${proposed.actor ? leader(proposed.actor) : "Un bando"} pone una oferta sobre la mesa`; cat = "onu"; }
  else if (defconMoves.length) { const s = defconMoves[0]; title = `${country(s)[0].toUpperCase() + country(s).slice(1)} pasa a DEFCON ${t.state.sides[s].defcon}`; cat = "alerta"; }
  else if (hard.length) { const [s, a] = hard[0]; title = `${leader(s)}: ${lowerFirst(actLabel(a.kind))}`; cat = /quarantine|ships/.test(a.kind) ? "bloqueo" : "alerta"; }
  else if (rejected) { title = `La propuesta ${rejected.description.match(/P\d+/)?.[0] || ""} cae`; }
  else if (soft.length) { const [s, a] = soft[0]; title = `${leader(s)}: ${lowerFirst(actLabel(a.kind))}`; }
  else if (intel.length) { title = intel[0].description; cat = "reconocimiento"; }
  else { title = "Mensajes cruzados, nadie mueve ficha"; }
  if (i === 0 && !cat) cat = "consejo_usa";

  // relato: lo que cada bando hizo de forma visible, en una frase por bando
  const story = [];
  for (const s of SIDES) {
    const acts = actionsOf(t, s).filter(a => !["private_message", "public_statement", "wait"].includes(a.kind));
    if (acts.length) story.push(`<span class="${cls(s)}">${esc(leader(s))}</span> decide ${esc(acts.map(a => lowerFirst(actLabel(a.kind))).join(", "))}.`);
  }
  if (proposed) {
    const id = proposed.description.match(/P\d+/)?.[0];
    const d = (t.state.deals || {})[id];
    if (d) story.push(`La propuesta ${esc(id)} pide: ${esc(d.terms.map(x => lowerFirst(termLabel(x.term)) + (x.secret ? " (en secreto)" : "")).join("; "))}.`);
  }
  for (const e of incidents.slice(title === incidents[0]?.description ? 1 : 0)) story.push(esc(e.description) + ".");
  for (const e of intel) if (e.description !== title) story.push(`Llega un informe: ${esc(lowerFirst(e.description))}${e.is_false ? " (es falso)" : ""}.`);
  if (prev) {
    const dt = t.state.tension - prev.tension;
    if (Math.abs(dt) >= 4) story.push(`La tensión ${dt > 0 ? "sube" : "baja"} ${Math.abs(dt).toFixed(0)} puntos, hasta ${t.state.tension.toFixed(0)} sobre 100.`);
  }
  if (outcome) story.push(esc(OUTCOME[t.state.outcome]?.[1] || ""), esc(t.state.outcome_reason || ""));

  // citas: lo que dicen los líderes (con voz si existe). Una por líder a la vista; el resto, plegadas.
  // los agentes a veces narran el envío («Mensaje privado al líder de…: '…'»); se queda solo lo dicho
  const clean = txt => txt.trim()
    .replace(/^(?:hacer una |enviar (?:un )?)?(?:declaración pública|mensajes? (?:privado|oficial|backchannel|enviados?)|mensaje)[^:]{0,90}:\s*/i, "")
    .replace(/^['"«“](.*)['"»”]\.?$/s, "$1");
  const rank = a => a.kind === "private_message" ? (a.channel === "backchannel" ? 0 : 1) : 2;
  const quote = (s, a, k) => {
    const how = a.kind === "public_statement" ? "en público" : (a.channel === "backchannel" ? "por el canal secreto" : "por la vía oficial");
    const src = V && V.files[`${t.turn}:${s}:${k}`];
    return `<blockquote class="${cls(s)}">${face(s, leader(s), "face")}<p class="who">${esc(leader(s))}, ${how}</p><p class="said">«${esc(clean(a.text))}»</p>${src ? `<audio controls preload="none" src="${esc(src)}" aria-label="Escuchar a ${esc(leader(s))} (voz sintética)"></audio>` : ""}</blockquote>`;
  };
  const shown = [], extra = [];
  for (const s of SIDES) {
    const said = actionsOf(t, s).map((a, k) => [a, k]).filter(([a]) => ["private_message", "public_statement"].includes(a.kind) && a.text)
      .sort((x, y) => rank(x[0]) - rank(y[0]));
    said.forEach(([a, k], n) => (n ? extra : shown).push(quote(s, a, k)));
  }
  const quotes = shown.concat(extra.length ? [`<details class="more"><summary>${extra.length === 1 ? "Un mensaje más" : extra.length + " mensajes más"} en este turno</summary>${extra.join("")}</details>`] : []);

  const quiet = !key && !cat && !proposed && !quotes.length;
  const ph = cat && (key || i === 0 || cat !== chapter.lastCat) ? photo(cat) : null;
  if (ph) chapter.lastCat = cat;
  return `<article class="chapter${key ? " key" : ""}${quiet ? " quiet" : ""}" id="t${t.turn}" data-i="${i}">
    <p class="when"><b>Turno ${t.turn}</b> ${esc(t.date)}</p>
    <h2>${esc(title)}</h2>
    ${story.length ? `<p>${story.join(" ")}</p>` : ""}
    ${figure(ph)}
    ${miniMap(t)}
    ${SIDES.map(s => adviceBlock(t, s)).join("")}
    ${quotes.join("")}
    ${inside(t, i)}
  </article>`;
}

/* ── Los consejos que recibió cada líder (partidas con asesores) ── */
function adviceBlock(t, s) {
  const dec = (t.decisions || {})[s] || {}, adv = (dec.advice || []).filter(a => a.valid);
  if (!adv.length) return "";
  const did = new Set((dec.actions || []).map(a => a.kind));
  const name = a => { const c = (C.advisors || {})[a.advisor]; return c ? (DATA.deanonymized ? c.name.split(" ").slice(-1)[0] : c.office) : a.who; };
  const office = a => ((C.advisors || {})[a.advisor] || {}).office || "";
  const followed = adv.filter(a => did.has(a.recommendation)).length;
  return `<div class="advice ${cls(s)}"><p class="who">Lo que aconsejaron a ${esc(leader(s))}: ${followed ? `siguió a ${followed} de ${adv.length}` : `no siguió a ninguno de los ${adv.length}`}</p>
    <ul>${adv.map(a => `<li>${faceSrc(a.advisor) ? `<img src="${esc(faceSrc(a.advisor))}" alt="">` : `<span class="mini">${esc(name(a)[0])}</span>`}<b>${esc(name(a))}</b><span class="rec">${esc(lowerFirst(actLabel(a.recommendation)))}</span>${did.has(a.recommendation) ? '<span class="ok">✓ lo hizo</span>' : '<span class="no">no lo hizo</span>'}</li>`).join("")}</ul>
    <details><summary>Sus argumentos</summary>${adv.map(a => `<p><b>${esc(name(a))}</b>${office(a) && DATA.deanonymized ? ` (${esc(office(a))})` : ""}: ${esc(a.argument || "")}${a.risk ? ` <i>Riesgo: ${esc(a.risk)}</i>` : ""}</p>`).join("")}</details></div>`;
}

/* ── El detalle: qué veía y pensaba cada bando ── */
function inside(t, i) {
  const col = s => {
    const obs = (t.observations || {})[s], dec = (t.decisions || {})[s] || {};
    const other = s === "USA" ? "USSR" : "USA";
    let h = `<div class="side"><h3 class="${cls(s)}">${esc(leader(s))}</h3>`;
    if (obs) {
      const real = (prevState(i) || t.state).tension;
      const off = Math.abs(obs.tension_estimate - real) >= 10;
      h += `<h4>Lo que creía</h4><ul>
        <li>Tensión: ${obs.tension_estimate.toFixed(0)} <span class="gap${off ? " off" : ""}">(real ${real.toFixed(0)})</span></li>
        <li>DEFCON de ${esc(leader(other))}: ${(obs.other_estimate?.defcon ?? 0).toFixed(0)} <span class="gap">(real ${((prevState(i) || t.state).sides[other].defcon)})</span></li>
        <li>Presión interna propia: ${obs.own.domestic_pressure.toFixed(0)}; credibilidad: ${obs.own.credibility.toFixed(0)}</li></ul>`;
      if (obs.inbox?.length) h += `<h4>Mensajes que recibió</h4><ul>${obs.inbox.map(m => `<li>${esc(m.text)}</li>`).join("")}</ul>`;
    }
    if (dec.reasoning) h += `<h4>Por qué decidió así${dec.fallback ? ' <span class="fallback">decisión de respaldo</span>' : ""}</h4><p class="reason">${esc(dec.reasoning)}</p>`;
    const acts = dec.actions || [];
    if (acts.length) h += `<h4>Todo lo que ordenó</h4><ul>${acts.map(a => `<li>${esc(actLabel(a.kind))}${a.terms ? ": " + esc(a.terms.map(x => termLabel(x.term)).join("; ")) : ""}${a.deal_id ? ` (${esc(a.deal_id)})` : ""}</li>`).join("")}</ul>`;
    return h + "</div>";
  };
  const world = (t.events || []).filter(e => e.kind !== "message");
  return `<details class="inside"><summary>Qué pasó por dentro</summary>
    <div class="sides">${SIDES.map(col).join("")}</div>
    ${world.length ? `<div class="world"><h4>Todo lo que ocurrió (la verdad, vea quien lo vea)</h4><ul>${world.map(e => `<li>${esc(e.description)}${e.is_false ? '<span class="false">información falsa</span>' : ""}${e.seen_by.length < 2 ? ` <span class="gap">(solo lo vio ${esc(leader(e.seen_by[0] || ""))})</span>` : ""}</li>`).join("")}</ul></div>` : ""}
  </details>`;
}

/* ── Antecedentes: la cronología real hasta el primer turno ── */
function prologue() {
  const H = DATA.history || [];
  if (!H.length) return "";
  const t0 = turnTime(T[0].turn).getTime();
  const when = e => Date.parse(`${e.date.length === 7 ? e.date + "-01" : e.date}T${e.time || "00:00"}:00Z`);
  const past = H.filter(e => when(e) <= t0 + 12 * 3600e3 && e.date >= "1962-10");
  const before = H.filter(e => when(e) <= t0 && e.date < "1962-10").slice(-3);
  const fmt = e => { const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(e.date); const mon = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"][+m[2] - 1];
    return `${m[3] ? +m[3] + " " : ""}${mon} ${m[1]}${e.time ? " · " + e.time : ""}`; };
  const li = e => `<li class="${e.danger >= 2 ? "danger" : ""}"><span class="d">${esc(fmt(e))}</span><b>${esc(e.title)}.</b> ${esc(e.text)}</li>`;
  const ph = (P.reconocimiento || [])[0];
  return `<article class="chapter prologue" id="antecedentes">
    <p class="when"><b>Antecedentes</b> · lo que ocurrió de verdad</p>
    <h2>${T[0].turn > 1 ? "Hasta aquí, la historia real" : "El punto de partida"}</h2>
    ${ph && T[0].turn <= 1 ? `<figure><img src="${esc(ph.src)}" alt="${esc(ph.caption)}" loading="lazy"><figcaption>${esc(ph.caption)} Foto: ${esc(ph.credit)}.</figcaption></figure>` : ""}
    ${(() => { const all = before.concat(past), shown = all.slice(-6), older = all.slice(0, -6);
      return `${older.length ? `<details class="more"><summary>${older.length} hechos anteriores</summary><ol>${older.map(li).join("")}</ol></details>` : ""}<ol>${shown.map(li).join("")}</ol>`; })()}
    <p class="begin">AQUÍ EMPIEZA LA SIMULACIÓN</p>
  </article>`;
}

/* ── Barra de fechas ── */
const HIST = [  // lo que pasó de verdad (hora de Washington)
  ["1962-10-16T08:45", "Kennedy ve las fotos del U-2"],
  ["1962-10-22T19:00", "Kennedy anuncia la cuarentena por televisión"],
  ["1962-10-24T10:00", "Entra en vigor la cuarentena; el SAC pasa a DEFCON 2"],
  ["1962-10-27T12:00", "Sábado Negro: derriban el U-2 de Anderson"],
  ["1962-10-27T19:45", "Robert Kennedy y Dobrynin pactan en secreto"],
  ["1962-10-28T09:00", "Jrushchov anuncia por radio que retira los misiles"],
];
const DAYS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const turnTime = turn => new Date(Date.parse(C.start + "Z") + turn * C.hours_per_turn * 3600e3);
let span = null;
function drawDatebar() {
  const bar = document.getElementById("datebar");
  if (!C.start) { bar.hidden = true; return; }
  const t0 = Date.parse(C.start.slice(0, 10) + "T00:00:00Z");
  const lastT = turnTime(T[T.length - 1].turn).getTime() + C.hours_per_turn * 3600e3;  // fin del último turno
  const t1 = Math.max(Date.parse("1962-10-29T00:00:00Z"), Math.ceil(lastT / 864e5) * 864e5);
  span = [t0, t1];
  const X = ms => (100 * (ms - t0) / (t1 - t0)).toFixed(2) + "%";
  const nDays = Math.round((t1 - t0) / 864e5);
  const days = [...Array(nDays)].map((_, k) => {
    const d = new Date(t0 + k * 864e5), wd = d.getUTCDay();
    const lbl = k === 0 || d.getUTCDate() % 2 === 0;
    return `<span class="day${wd === 6 ? " wk" : ""}${lbl ? " lbl" : ""}" style="left:${X(d.getTime())}">${DAYS[wd]} ${d.getUTCDate()}${k === 0 ? " oct." : ""}</span>`;
  }).join("");
  const firstT = turnTime(T[0].turn).getTime();
  const forked = T[0].turn > 1;
  bar.innerHTML = `<div class="track" id="track" title="Pulsa para ir a ese momento de la partida">${days}
      ${forked ? `<span class="real" style="left:0;width:${X(firstT)}"></span>` : ""}
      <span class="played" style="left:${X(firstT)};width:calc(${X(lastT)} - ${X(firstT)})"></span>
      ${HIST.map(([d, txt]) => `<span class="hist" style="left:${X(Date.parse(d + ":00Z"))}" title="${esc(txt)}"></span>`).join("")}
      <span class="now" id="now"><span></span></span></div>
    <div class="key">${forked ? `<span><i style="width:18px;height:9px;background:repeating-linear-gradient(135deg,var(--rule) 0 4px,transparent 4px 8px)"></i>Historia real</span>` : ""}
      <span><i style="width:18px;height:9px;background:var(--heat)"></i>Partida simulada (cada turno, 12 horas)</span>
      <span><i style="width:8px;height:8px;background:var(--ink);transform:rotate(45deg)"></i>Lo que pasó de verdad</span></div>`;
  bar.hidden = false;
  document.getElementById("track").onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const ms = t0 + (t1 - t0) * (e.clientX - r.left) / r.width;
    let best = T[0];
    for (const t of T) if (Math.abs(turnTime(t.turn) - ms) < Math.abs(turnTime(best.turn) - ms)) best = t;
    document.getElementById("t" + best.turn)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  };
  const nav = document.getElementById("topnav");
  document.documentElement.style.setProperty("--navh", (nav.hidden ? 0 : nav.offsetHeight) + "px");
  document.documentElement.style.setProperty("--barh", bar.offsetHeight + "px");
}
function markNow(i) {
  const el = document.getElementById("now");
  if (!el || !span) return;
  const t = T[i], ms = turnTime(t.turn).getTime(), pct = 100 * (ms - span[0]) / (span[1] - span[0]);
  el.style.left = pct.toFixed(2) + "%";
  el.classList.toggle("flip", pct > 70);
  el.firstElementChild.textContent = `Turno ${t.turn} · ${t.date}`;
}

/* ── Panel con el estado del turno visible ── */
function gauge(v) {  // medidor de aguja, 0–100; zona roja a partir de 80
  const a = -90 + 180 * Math.max(0, Math.min(100, v)) / 100;
  const pt = (deg, r) => { const t = (deg - 90) * Math.PI / 180; return [100 + r * Math.cos(t), 100 + r * Math.sin(t)]; };
  const arc = (d0, d1, r) => { const [x0, y0] = pt(d0, r), [x1, y1] = pt(d1, r); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  const ticks = [...Array(11)].map((_, k) => { const d = -90 + k * 18, [x0, y0] = pt(d, 78), [x1, y1] = pt(d, k % 5 ? 70 : 64), [tx, ty] = pt(d, 54);
    return `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#2a2a22" stroke-width="${k % 5 ? 1.5 : 2.5}"/>${k % 5 ? "" : `<text x="${tx.toFixed(1)}" y="${(ty + 3).toFixed(1)}" text-anchor="middle">${k * 10}</text>`}`; }).join("");
  return `<svg class="gauge" viewBox="0 0 200 118" role="img" aria-label="Tensión ${v.toFixed(0)} sobre 100">
    <path class="face" d="M8 108 A92 92 0 0 1 192 108 Z"/>
    <path d="${arc(54, 90, 78)}" fill="none" stroke="#c8321f" stroke-width="9"/>
    <path d="${arc(18, 54, 78)}" fill="none" stroke="#e0a32a" stroke-width="9"/>
    ${ticks}
    <text class="lbl" x="100" y="80" text-anchor="middle">TENSIÓN</text>
    <text x="100" y="93" text-anchor="middle" style="font:700 15px 'Courier Prime',monospace">${v.toFixed(0)}</text>
    <g class="needle" style="transform:rotate(${a.toFixed(1)}deg)"><line x1="100" y1="100" x2="100" y2="28" stroke="#111" stroke-width="3" stroke-linecap="round"/></g>
    <circle cx="100" cy="100" r="7" fill="#111"/><circle cx="100" cy="100" r="2.5" fill="#999"/>
  </svg>`;
}

function rail(i) {
  markNow(i);
  const t = T[i], st = t.state, v = st.vars || {};
  const board = s => { const d = st.sides[s].defcon;
    return `<div class="board" role="img" aria-label="${esc(country(s))}: DEFCON ${d}"><div class="bl"><span>${s === "USA" ? "EE. UU." : "URSS"} · DEFCON</span><span>${esc(leader(s))}</span></div>
      <div class="wins">${[5, 4, 3, 2, 1].map(n => `<span class="${n === d ? "on d" + n : ""}">${n}</span>`).join("")}</div></div>`; };
  const open = Object.values(st.deals || {}).filter(d => ["open", "accepted"].includes(d.status));
  const item = (on, txt, good) => `<li class="${on ? (good ? "good" : "yes") : ""}">${txt}</li>`;
  document.getElementById("rail").innerHTML = `
    <h3>Estado al final del turno</h3>
    <p class="now">Turno ${t.turn} · ${esc(t.date)}</p>
    ${gauge(st.tension)}
    <div class="boards">${SIDES.map(board).join("")}</div>
    <ul class="status">
      ${item(v.quarantine >= 0.5, "Cuarentena naval en vigor")}
      ${item(v.construction_active >= 0.5, "Obras de las bases en marcha")}
      ${item(v.missiles_withdrawn >= 0.5, "Misiles de Cuba retirados", true)}
      ${item(v.invasion_pledge >= 0.5, "Compromiso de no invadir", true)}
      ${item(v.jupiters_turkey < 0.5, "Jupiter retirados de Turquía", true)}
    </ul>
    <div class="deals">${open.length ? open.map(d => `${esc(d.id)} (${d.status === "accepted" ? "ACEPTADA" : "ABIERTA"}): ${esc(d.terms.map(x => lowerFirst(termLabel(x.term))).join("; "))}`).join("<br>") : "SIN PROPUESTAS ABIERTAS"}</div>`;
}

/* ── Sismógrafo: la tensión de cada capítulo, alineada con él ── */
function drawTrace() {
  if (!T || !T.length) return;  // en directo, hasta que llegan los primeros turnos
  const svg = document.getElementById("trace"), box = svg.getBoundingClientRect();
  const w = box.width, top = box.top + window.scrollY;
  // escala ajustada al rango de la partida (la tensión suele moverse en una franja estrecha)
  const lo = Math.max(0, Math.floor((Math.min(...T.map(t => t.state.tension)) - 5) / 10) * 10);
  const X = v => 6 + (w - 12) * (v - lo) / (100 - lo);
  const pts = [...document.querySelectorAll(".chapter[data-i]")].map(el => {
    const t = T[+el.dataset.i];
    return [X(t.state.tension), el.getBoundingClientRect().top + window.scrollY - top + 12, t];
  });
  if (!pts.length) return;
  const css = getComputedStyle(document.documentElement);
  const step = (100 - lo) / 4;
  const grid = [1, 2, 3, 4].map(k => lo + k * step).map(p => { const x = X(p); return `<line x1="${x}" x2="${x}" y1="0" y2="${box.height}" stroke="${css.getPropertyValue("--rule")}" stroke-dasharray="${p === 100 ? "none" : "2 5"}"/>`; }).join("");
  const path = pts.map(([x, y], k) => (k ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join(" ");
  const dots = pts.map(([x, y, t]) => {
    const r = (t.events || []).some(e => ["incident", "outcome"].includes(e.kind)) ? 6 : 3.5;
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${css.getPropertyValue("--heat")}"/><text x="${x - 10}" y="${y + 4}" text-anchor="end" font-family="Archivo, sans-serif" font-size="12" fill="${css.getPropertyValue("--ink-soft")}">${t.state.tension.toFixed(0)}</text>`;
  }).join("");
  svg.innerHTML = `${grid}<text x="6" y="-8" font-family="Archivo, sans-serif" font-size="12" fill="${css.getPropertyValue("--ink-soft")}">tensión ${lo}</text><text x="${w - 6}" y="-8" text-anchor="end" font-family="Archivo, sans-serif" font-size="12" fill="${css.getPropertyValue("--ink-soft")}">100</text><path d="${path}" fill="none" stroke="${css.getPropertyValue("--heat")}" stroke-width="2.5" stroke-linejoin="round"/>${dots}`;
}

/* ── Portada, ficha y cierre ── */
function draw() {
  C = DATA.catalog; T = DATA.turns; V = DATA.voices; P = DATA.photos || {}; photoUse = {}; mapUse.clear();
  const nav = DATA.nav || (LIVE ? [{href: "index.html", label: "Inicio"}] : null);
  const navEl = document.getElementById("topnav");
  if (nav) {
    navEl.hidden = false;
    navEl.innerHTML = `<a class="brand" href="${esc(nav[0].href)}">CAVALIER</a>${nav.map(n => `<a href="${esc(n.href)}">${esc(n.label)}</a>`).join("")}${DATA.status === "running" ? '<span class="live">En directo</span>' : ""}`;
  }
  const h = DATA.header || {}, first = T[0], last = T[T.length - 1].state;
  const running = DATA.status === "running";
  const oc = running ? ["La partida está en marcha", `Turno ${T[T.length - 1].turn} jugado. Los líderes deciden el siguiente; la página se actualiza sola.`]
    : OUTCOME[last.outcome] || ["Partida en curso", "La partida aún no ha terminado."];
  const heroPh = photo("reconocimiento") || photo("misiles") || photo("consejo_usa");
  document.title = `${oc[0]} · Cavalier`;
  const forked = first.turn > 1;
  const realDate = d => { const x = new Date(d); return `${["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"][x.getUTCDay()]}, ${x.getUTCDate()} de ${["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"][x.getUTCMonth()]} de 1962`; };
  const endT = turnTime(T[T.length - 1].turn);
  document.getElementById("top").innerHTML = `<div>
    <div class="mast"><h2>La Crónica de la Crisis</h2>
      <div class="line"><span>${esc(realDate(endT))}</span><span>Simulación Cavalier · semilla ${esc(h.seed ?? "—")}</span><span>Ningún diario real publicó esto</span></div></div>
    <p class="extra">EDICIÓN EXTRA</p>
    <h1>${esc(oc[0])}</h1>
    <p class="deck">${esc(oc[1])}</p>
    <div class="cols">
      ${heroPh ? `<figure><img src="${esc(heroPh.src)}" alt="${esc(heroPh.caption)}"><figcaption>${esc(heroPh.caption)} Foto: ${esc(heroPh.credit)}.</figcaption></figure>` : "<div></div>"}
      <div class="lead">
        <p>${running ? "" : esc(String(last.outcome_reason || "").replace(/['"«»]/g, "")) + ". "}${forked ? `La partida arranca en un momento real, el turno ${esc(first.turn)} (${esc(first.date)}): todo lo anterior ocurrió de verdad, y desde ahí deciden dos agentes de inteligencia artificial que hacen de Kennedy y de Jrushchov.` : "La partida arranca el 16 de octubre, el día en que Kennedy ve las fotos de los misiles. Desde ese momento deciden dos agentes de inteligencia artificial que hacen de Kennedy y de Jrushchov."}</p>
        <p>Cada turno son doce horas de la crisis. Este relato cuenta lo que hicieron, lo que se dijeron y lo que pasó por dentro.</p>
        <p><a href="${forked ? "#antecedentes" : "#antecedentes"}">Leer cómo se llegó aquí ↓</a></p>
      </div>
    </div></div>`;

  const allEv = T.flatMap(t => t.events || []);
  const proposals = allEv.filter(e => e.kind === "deal" && /enviada/i.test(e.description)).length;
  const maxT = Math.max(...T.map(t => t.state.tension));
  const minDef = Math.min(...T.flatMap(t => SIDES.map(s => t.state.sides[s].defcon)));
  const msgs = T.reduce((n, t) => n + SIDES.reduce((m, s) => m + actionsOf(t, s).filter(a => a.text && ["private_message", "public_statement"].includes(a.kind)).length, 0), 0);
  const adv = T.reduce((n, t) => n + SIDES.reduce((m, s) => m + (((t.decisions || {})[s] || {}).advice || []).length, 0), 0);
  const field = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  const shortDate = d => `${d.getUTCDate()} ${["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"][d.getUTCMonth()]}`;
  document.getElementById("facts").innerHTML = `<div class="sheet">
    <p class="cls">ALTO SECRETO · DESCLASIFICADO</p>
    <div class="hd"><span>Expediente CVL-${esc(String(h.seed ?? 0).padStart(4, "0"))}</span><span>Hoja de control</span><span>Periodo: ${shortDate(turnTime(first.turn))} – ${shortDate(endT)} 1962</span></div>
    <dl>${field("Informes (turnos de 12 h)", T.length)}${field("Tensión máxima", maxT.toFixed(0) + "/100")}${field("Alerta más alta", "DEFCON " + minDef)}${field("Incidentes", allEv.filter(e => e.kind === "incident").length)}${field("Propuestas de acuerdo", proposals)}${field("Mensajes interceptados", msgs)}${adv ? field("Consejos recibidos", adv) : ""}${field("Desenlace", esc(running ? "EN CURSO" : (OUTCOME[last.outcome] || ["—"])[0].toUpperCase()))}</dl>
    <div class="stamp" aria-hidden="true">DESCLASIFICADO</div>
    <p class="cls bottom">ALTO SECRETO · DESCLASIFICADO</p>
  </div>`;

  chapter.lastCat = null;
  drawDatebar();
  document.getElementById("chapters").innerHTML = prologue() + T.map(chapter).join("") +
    (running ? `<article class="chapter quiet thinking"><p class="when"><b>Turno ${T[T.length - 1].turn + 1}</b></p><h2><span class="live">Los líderes están decidiendo…</span></h2></article>` : "");

  const agents = h.agents ? Object.entries(h.agent_labels || h.agents).map(([s, a]) => `${leader(s)}: ${a}`).join("; ") : "";
  const credits = DATA.photo_credits || [];
  document.getElementById("ending").innerHTML = `<div>
    <h2>${esc(oc[0])}</h2>
    <p>${esc(oc[1])} ${esc(last.outcome_reason || "")}</p>
    <div class="notes">
      <p>Esto es una simulación. Las decisiones y los mensajes los generan agentes de IA dentro de un motor con supuestos explícitos; no describen lo que ocurrió en 1962 ni lo que habría ocurrido.${V ? " " + esc(V.notice) : ""}</p>
      ${DATA.deanonymized ? "<p>Los agentes jugaron con nombres ficticios («la Federación Atlántica», «el Primer Secretario», «la Isla», «Día 12») para no reconocer la crisis y limitarse a razonar sobre la situación que veían. Aquí se muestran los nombres y las fechas reales.</p>" : ""}
      ${agents ? `<p>Agentes: ${esc(agents)}.</p>` : ""}
      ${credits.length ? `<p>Fotografías históricas: ${credits.map(c => `${esc(c.caption)} ${esc(c.credit)}, ${esc(c.license)}${c.source ? ` (<a href="${esc(c.source)}">fuente</a>)` : ""}`).join(". ")}.</p>` : ""}
    </div></div>`;

  rail(running ? T.length - 1 : 0);
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (vis) rail(+vis.target.dataset.i);
  }, {rootMargin: "-30% 0px -60% 0px"});
  document.querySelectorAll(".chapter[data-i]").forEach(el => io.observe(el));
  document.querySelectorAll("img").forEach(img => img.addEventListener("load", redraw));
  redraw();
}

let io = null;
const redraw = () => requestAnimationFrame(drawTrace);
function setup() {
  document.addEventListener("play", e => document.querySelectorAll("audio").forEach(a => { if (a !== e.target) a.pause(); }), true);
  window.addEventListener("resize", redraw);
  document.addEventListener("toggle", redraw, true);
  if (document.fonts) document.fonts.ready.then(redraw);
}

/* ── En directo (servidor local, `cavalier serve`): se consulta la partida cada pocos segundos ── */
let shown = "";
async function poll() {
  const box = document.getElementById("chapters");
  let d;
  try {
    d = await (await fetch(`/api/games/${encodeURIComponent(LIVE)}`)).json();
  } catch (e) {
    box.innerHTML = `<p class="waiting">No se puede contactar con el servidor local. ¿Sigue abierto <code>cavalier serve</code>?</p>`;
    return setTimeout(poll, 5000);
  }
  if (d.error) {
    box.innerHTML = `<p class="waiting">La partida se ha detenido: ${esc(d.error)}</p>`;
    return;
  }
  if (d.turns && d.turns.length) {
    const key = d.turns.length + ":" + d.status;
    if (key !== shown) { shown = key; DATA = d; draw(); }
  } else {
    box.innerHTML = `<p class="waiting"><span class="live">Preparando la partida: ${esc(d.progress || "cargando el modelo")}…</span></p>`;
  }
  if (d.status === "running" || d.status === "starting") setTimeout(poll, 3000);
}

setup();
if (DATA) draw(); else if (LIVE) poll();
</script>
</body>
