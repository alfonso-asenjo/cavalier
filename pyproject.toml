[project]
name = "cavalier"
version = "0.1.0"
description = "Simulador de decisiones en crisis nucleares históricas con agentes de IA"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
]

[project.optional-dependencies]
llm = [
    "langgraph>=0.2",
    "openai>=1.30",
]
dev = ["pytest>=8"]

[project.scripts]
cavalier = "cavalier.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cavalier = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
