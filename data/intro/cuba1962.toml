# =============================================================================== secciones

[[sections]]
id = "contexto"
title = "Un mundo partido en dos"
kicker = "Dos superpotencias nucleares, una revolución a 150 km de Florida y una invasión fracasada."
photo = "jrushchov_1.jpg"
body = """
Desde 1945, Estados Unidos y la Unión Soviética (URSS) se disputan el mundo sin llegar a enfrentarse directamente: es la **Guerra Fría**. Los dos tienen armas nucleares, y cada uno teme que el otro intente destruirlo primero.

En enero de 1959, la revolución de **Fidel Castro** derrocó al dictador Fulgencio Batista en Cuba [s2]. En abril de 1961, unos exiliados cubanos entrenados y pagados por la CIA desembarcaron en **Bahía de Cochinos** con un plan heredado de Eisenhower y aprobado por Kennedy; el ejército cubano los derrotó en dos días [s2]. El fracaso reforzó a Castro, que proclamó el carácter socialista de su revolución y se acercó a Moscú [s2].

Washington no se rindió. En noviembre de 1961 aprobó un programa encubierto, la **Operación Mongoose**, para «sacar del poder» al régimen de Castro; su calendario apuntaba a una posible intervención militar en octubre de 1962 [s2]. En La Habana y en Moscú había, por tanto, motivos reales para temer una invasión.

Además, la balanza nuclear estaba muy desequilibrada. En octubre de 1962, EE. UU. tenía unas **3.500 armas nucleares listas** para lanzarse contra la URSS; la URSS tenía unas 300 capaces de alcanzar EE. UU. [s3, s4]. En misiles **ICBM** (misiles balísticos intercontinentales, que cruzan de un continente a otro en unos 30 minutos) la ventaja era de unos 4 a 1 [s3].

Y EE. UU. tenía misiles nucleares a las puertas de la URSS: 60 **Thor** en el Reino Unido, 30 **Jupiter** en Italia y 15 Jupiter en Turquía, estos últimos plenamente operativos desde marzo de 1962 [s3]. Según el National Security Archive, fueron los de Turquía los que más irritaron a Nikita Jrushchov, el líder soviético [s11].
"""

[[sections]]
id = "despliegue"
title = "Operación Anadyr"
kicker = "Jrushchov decide mandar en secreto misiles nucleares a Cuba, y casi todo su gobierno le sigue."
photo = "misiles_1.jpg"
body = """
El 21 de mayo de 1962, Jrushchov propuso al **Presídium** (el órgano que dirigía el Partido Comunista y, con él, la URSS) instalar misiles nucleares en Cuba en secreto y anunciarlo después. Según el acta, dijo: «Será una política ofensiva» [s13]. Hicieron falta dos sesiones para aprobarlo, el 21 y el 24 de mayo [s13]. Según el historiador Serhii Plokhy, **Mikoyán** advirtió de consecuencias «peligrosas o incluso catastróficas» [s34].

Las razones soviéticas eran tres, y los historiadores discuten cuál pesó más [s37, s34]: **defender Cuba** de una invasión estadounidense; **compensar la inferioridad nuclear**, porque desde Cuba un misil de alcance medio llegaba a Washington en unos 13 minutos [s3]; y **responder a los Jupiter** de Turquía con la misma moneda. Castro dijo en 1992 que aceptó porque los misiles reequilibraban la balanza mundial, no solo para defender Cuba [s20]; los cubanos creían que venían «para quedarse» [s13].

El plan era enorme. Preveía 48 misiles **R-12** (MRBM, misiles balísticos de alcance medio, unos 2.000 km) y 32 **R-14** (IRBM, de alcance intermedio, unos 4.500 km) [s3]. Unos 85 barcos mercantes hicieron 150 viajes [s3] y llevaron a Cuba unos **42.000 soldados soviéticos** [s3, s5]. Con ellos iban armas nucleares **tácticas**, pensadas para el campo de batalla: 80 ojivas para misiles de crucero FKR, 12 para cohetes Luna y 6 bombas para bombarderos IL-28 [s5].

El 4 de octubre, el carguero *Indigirka* descargó en el puerto de Mariel 90 cabezas nucleares [s3, s5]. Todo se hizo con engaños: aunque el 4 de septiembre Kennedy había advertido en público contra la llegada de armas ofensivas [s1], el 18 de octubre el ministro **Gromyko** le habló solo de armas «defensivas» y cablegrafió a Moscú que la situación era «completamente satisfactoria» [s14]. Jrushchov admitió después que Gromyko mintió por orden del partido [s13].
"""

[[sections]]
id = "descubrimiento"
title = "Las fotos del U-2"
kicker = "Un avión espía fotografía los emplazamientos y Kennedy reúne en secreto a sus asesores."
photo = "reconocimiento_1.jpg"
body = """
El 14 de octubre, un avión espía **U-2** (vuela a más de 20 km de altura y fotografía el terreno) sobrevoló el oeste de Cuba. Sus fotos mostraban emplazamientos de misiles en construcción. Kennedy vio las pruebas a las 8:45 del martes 16 de octubre [s3].

Ese mismo día reunió a un grupo de asesores, el **ExComm** (Comité Ejecutivo del Consejo de Seguridad Nacional), y grabó en secreto sus reuniones. Las cintas muestran que el día 16 **casi todos se inclinaban por alguna acción militar**. El general Taylor quería eliminar los misiles «sin ningún aviso» [s15]. Esa noche, cuando le preguntaron cuánto cambiaban los misiles el equilibrio estratégico, McNamara respondió: «Mi opinión personal es: en absoluto» [s16].

Se discutieron tres caminos: un **ataque aéreo** contra los emplazamientos, una **invasión** de la isla o un **bloqueo naval**. Un bloqueo es legalmente un acto de guerra, así que se le llamó **«cuarentena»**, una figura distinta que ayudó a obtener el apoyo de la Organización de Estados Americanos [s1]. Robert Kennedy rechazó el ataque por sorpresa recordando Pearl Harbor: «no está en nuestras tradiciones» [s36]. McGeorge Bundy, en cambio, tras una noche en vela volvió a defender el ataque «quirúrgico» [s36].

El 19 de octubre, ante los jefes militares, el general LeMay dijo que el bloqueo era «casi tan malo como el apaciguamiento de Múnich» (la cesión a Hitler en 1938) [s18]. El 20, Kennedy eligió la cuarentena, ordenó preparar un ataque para días después, aceptó hablar de Turquía más adelante y rechazó con dureza la idea de Stevenson de ofrecer también la base de Guantánamo [s17].
"""

[[sections]]
id = "trece_dias"
title = "La cuarentena"
kicker = "Un discurso, una línea de barcos en el mar y una guerra de nervios con cartas que tardan horas en llegar."
photo = "consejo_usa_2.jpg"
body = """
El lunes 22 de octubre a las 19:00, Kennedy contó todo por televisión. Anunció la cuarentena y advirtió que EE. UU. consideraría «cualquier misil nuclear lanzado desde Cuba contra cualquier nación del hemisferio occidental como un ataque de la Unión Soviética contra Estados Unidos, que exigirá una respuesta de represalia completa contra la Unión Soviética» [s3]. A esa hora, todas las fuerzas estadounidenses pasaron a **DEFCON 3** [s3]. DEFCON es la escala de alerta militar de EE. UU.: va de 5 (paz) a 1 (guerra); el Mando Aéreo Estratégico (SAC), que controlaba bombarderos y misiles nucleares, estaba normalmente en DEFCON 4 [s3].

En Moscú, el Presídium se reunió esa noche. El mariscal **Malinovski** pensaba que el discurso era una «maniobra electoral» y Jrushchov llegó a contemplar el uso de armas tácticas ante un desembarco, pero no el de las estratégicas [s13]. A la mañana siguiente decidieron dar la vuelta a los barcos que aún no habían llegado; los cuatro submarinos siguieron adelante [s13].

El miércoles 24 a las 10:00 entró en vigor la cuarentena y **el SAC pasó a DEFCON 2**, a un paso de la guerra; el resto de las fuerzas siguió en DEFCON 3 [s3]. Su jefe, el general Power, se dirigió a sus tropas sin cifrar el mensaje, para que los soviéticos lo oyeran [s3]. La famosa escena de los barcos soviéticos que «parpadean» ante la línea es en gran parte un mito: los buques ya habían dado la vuelta y estaban a más de 500 millas náuticas [s3].

El 25, en el Consejo de Seguridad de la ONU, el embajador **Stevenson** exigió al soviético Zorin un sí o un no: «Estoy dispuesto a esperar mi respuesta hasta que se congele el infierno», y mostró las fotos de los misiles [s26]. Ese mismo día, en Moscú, Jrushchov ya proponía desmantelar a cambio de una garantía de no invasión: «Empezamos y nos entró miedo» [s13].

El viernes 26 llegó una larga carta de Jrushchov que proponía «desatar ese nudo»: retirada de los misiles a cambio de no invadir Cuba [s1]. Ese día hubo además un canal paralelo: el espía soviético **Aleksandr Feklisov** y el periodista de ABC John Scali hablaron de una fórmula parecida [s1]. Washington lo creyó decisivo; los archivos del KGB muestran que su informe llegó a Moscú demasiado tarde para influir en las cartas [s14].
"""

[[sections]]
id = "comunicacion"
title = "Cómo se hablaban"
kicker = "Sin teléfono rojo: cartas cifradas que tardaban horas, la radio y una cita discreta en el Departamento de Justicia."
body = """
En 1962 no había una línea directa entre Washington y Moscú: se acordó en junio de 1963, precisamente por lo que había pasado [s23]. Kennedy y Jrushchov se escribían **cartas oficiales**. Cada una se cifraba, se enviaba por telégrafo a la embajada, se descifraba y se traducía, así que llegaba horas después de escribirse, a veces por partes, y mientras tanto la crisis seguía avanzando [s13, s19].

Por eso Jrushchov acabó usando la **radio**. El 27 de octubre, Radio Moscú leyó en público su segunda carta, la que pedía los Jupiter de Turquía, y el 28 anunció por el mismo medio que retiraba los misiles: era mucho más rápido que una carta [s1, s13]. Lo que se dice **en público** (un discurso por televisión, una sesión de la ONU) también es una forma de presión: compromete, porque echarse atrás después cuesta prestigio.

El **canal secreto** era otra cosa: una conversación discreta, sin actas oficiales ni testigos, en la que se puede ofrecer lo que no se puede decir en público. El decisivo fue el de **Robert Kennedy** y el embajador **Dobrynin**. La noche del 27 de octubre se vieron en el Departamento de Justicia, y Robert Kennedy prometió que los Jupiter saldrían de Turquía siempre que nadie lo hiciera público [s10, s12]. Hubo otro, menos decisivo, entre el espía soviético Aleksandr Feklisov y el periodista John Scali [s14].

Los militares tenían su propio problema. Un **submarino** soviético solo podía recibir órdenes cuando subía cerca de la superficie, así que pasaba largos periodos sin contacto con Moscú, y su capitán tenía que decidir solo [s7].

En el simulador, cada líder elige por qué vía habla: en público, por la vía oficial o por el canal secreto. Solo por el canal secreto se pueden pactar condiciones en secreto, como pasó con los Jupiter, y cada turno hay una pequeña probabilidad (un 3 %) de que se filtren.
"""
photo = ""

[[sections]]
id = "al_borde"
title = "Sábado negro"
kicker = "El 27 de octubre, todo lo que podía salir mal empezó a salir mal, y casi nada lo decidieron los líderes."
photo = "submarino_1.jpg"
body = """
El sábado 27 por la mañana, Radio Moscú emitió una **segunda carta** que añadía una condición: retirar también los Jupiter de Turquía [s1]. En Washington se leyó como un endurecimiento [s10]. Las actas del Presídium muestran que la idea fue del propio Jrushchov, que razonó que los estadounidenses no se atreverían a atacar [s13].

Ese mismo sábado, un misil antiaéreo soviético derribó sobre Banes, en el este de Cuba, el U-2 del mayor **Rudolf Anderson**, que murió. Según el testimonio del general Garbuz, la orden la dieron dos generales soviéticos en Cuba sin poder consultar ni a su jefe, Pliev, ni a Moscú [s8]. La víspera, Castro los había convencido de encender sus radares [s8]. En Washington, el general Taylor recomendó atacar la batería al día siguiente y McNamara dijo que la invasión se había vuelto inevitable; Kennedy levantó la reunión sin decidir [s19].

Casi a la vez, otro U-2, el del capitán **Charles Maultsby**, se perdió en una misión cerca del Polo Norte y entró por error en la URSS. Despegaron cazas soviéticos para derribarlo, y desde Alaska salieron cazas estadounidenses F-102 armados con misiles nucleares [s9, s6]. Kennedy comentó que «siempre hay algún hijo de perra que no se entera» [s6]. Por la tarde, destructores estadounidenses obligaron a emerger al submarino soviético **B-59** con cargas de profundidad de práctica; a bordo había un torpedo nuclear [s7].

Esa noche, la inteligencia estadounidense informó de que todos los misiles de alcance medio estaban operativos [s6] (el jefe soviético de misiles dijo después que solo 6 a 8 lanzadores lo estaban [s3]). Las ojivas ya se habían acercado a los lanzadores [s6]. Y Castro, que veía la invasión «casi inevitable», escribió a Jrushchov que en ese caso un golpe nuclear sería «la más legítima defensa propia» [s13].

La salida tuvo dos partes. En público, Kennedy aceptó los términos de la primera carta. En privado, a las 19:45, **Robert Kennedy** recibió al embajador **Dobrynin** en el Departamento de Justicia: si los misiles salían de Cuba, los Jupiter saldrían de Turquía en cuatro o cinco meses, pero eso no podía hacerse público [s10]. Según el cable de Dobrynin, RFK pidió respuesta para el día siguiente y lo presentó como «una petición, y no un ultimátum» [s10]; también le dijo que había generales «deseando pelear» [s14].
"""

[[sections]]
id = "desenlace"
title = "La retirada y la crisis de noviembre"
kicker = "Jrushchov acepta por la radio, Castro se siente traicionado y quedan cien armas nucleares que nadie conoce."
photo = "retirada_1.jpg"
body = """
El domingo 28, hacia las 9:00 de Washington, Radio Moscú anunció que la URSS desmontaría los misiles [s1, s20]. Lo hizo por radio y con prisas porque corrió el rumor, falso, de que Kennedy iba a hablar otra vez; con las prisas no se consultó a Castro y no se definió qué eran «armas ofensivas» [s20]. Bundy lo llamó «el día de las palomas» [s31].

**Castro** se sintió humillado y rechazó cualquier inspección de la ONU en Cuba [s5]. Jrushchov envió a su hombre de confianza, **Mikoyán**, que llegó a La Habana el 2 de noviembre [s5]. Durante la misión murió en Moscú su esposa, con la que llevaba más de cuarenta años casado [s21].

Quedaban cabos sueltos. EE. UU. exigió también los 42 bombarderos **IL-28** [s3]; el 20 de noviembre, cuando la URSS aceptó llevárselos, Kennedy levantó la cuarentena [s1]. Y estaban las armas **tácticas**, de las que Washington no sabía nada: Moscú pensó primero en dejarlas y en entregarlas algún día a los cubanos, pero el 22 de noviembre Mikoyán dijo a Castro que saldrían, invocando una «ley no publicada» que en realidad no existía [s3, s5, s21]. El 1 de diciembre el barco *Arjánguelsk* zarpó con las 98 ojivas tácticas [s5].

El SAC siguió en DEFCON 2 hasta el 21 de noviembre [s3]. Los Jupiter de Turquía se desmontaron en abril de 1963 [s11]. La existencia de las armas tácticas no se reveló hasta los años noventa: en una conferencia en La Habana, en 1992, la noticia conmocionó a antiguos responsables como McNamara [s5].
"""

[[sections]]
id = "jupiter"
title = "Los Jupiter: poco valor militar, mucho valor político"
kicker = "Quince misiles viejos en Turquía casi deciden el final de la crisis. ¿Por qué tanto secreto?"
photo = "misiles_2.jpg"
body = """
En Turquía había **15 misiles Jupiter**, cerca de Esmirna, plenamente operativos desde marzo de 1962. El 22 de octubre, en plena crisis, se entregaron a tripulaciones turcas, aunque las cabezas nucleares siguieron bajo custodia estadounidense [s3]. Cada uno llevaba una ojiva de 1,4 megatones [s3].

**Militarmente pesaban poco.** Eran de combustible líquido y estaban de pie, al aire libre: un tiro de francotirador podía perforar su fina piel y dejarlos inservibles [s3]. Eran imprecisos (fallaban por unos 1,8 km) [s28] y los propios documentos estadounidenses los llamaban «obsoletos y vulnerables» [s11]. Los 105 Thor y Jupiter de Europa eran una fracción pequeña de las 3.500 armas listas de EE. UU. [s3]. Y llegaban sus sustitutos: los submarinos **Polaris**, que lanzan misiles **SLBM** (balísticos desde un submarino sumergido, casi imposibles de destruir por sorpresa). El *Sam Houston* entró en el Mediterráneo en marzo de 1963 y visitó Esmirna el 14 de abril [s11, s3].

Ya antes de la crisis había dudas. Eisenhower y Kennedy siguieron adelante con el despliegue porque cancelarlo parecía dañar la credibilidad de EE. UU. [s29]. En agosto de 1962 Kennedy pidió al Pentágono estudiar su retirada, pero no dio ninguna orden [s3, s29].

**Políticamente pesaban muchísimo.** Retirarlos a la vista de todos, bajo amenaza, habría parecido que EE. UU. cambiaba la seguridad de un aliado por la suya. El ministro turco de Defensa advirtió de que la retirada dañaría la «confianza» de Turquía en EE. UU. [s12]. Thompson se opuso al canje público por su efecto en la OTAN [s32]. Kennedy veía el riesgo contrario: si se llegaba a la guerra por no ceder los Jupiter, «todo el mundo va a decir: bueno, aquella era una propuesta bastante buena» [s39], y Bundy escribió que algunos pensaban que hasta una garantía privada podía traicionar a un aliado [s10].

Por eso se hizo **en secreto**. Solo nueve personas en Washington lo sabían; Rusk y McNamara negaron ante el Congreso que hubiera habido un trato [s12]. EE. UU. consiguió lo que quería (los misiles y los IL-28 fuera de Cuba) sin ceder nada en público. Jrushchov consiguió la promesa de no invadir Cuba y la salida de los Jupiter, pero no pudo presentarlo como victoria, y pareció que había retrocedido. El secreto se fue filtrando: en 1970 lo insinuó el ex primer ministro turco İnönü, en 1974 las memorias de Jrushchov, y en 1989 Sorensen admitió que lo había borrado del libro de Robert Kennedy [s11, s10].
"""

[[sections]]
id = "legado"
title = "Por qué estuvo tan cerca, y qué vas a ver ahora"
kicker = "Ninguno de los dos líderes quería la guerra. El peligro estaba en lo que no controlaban."
photo = "kennedy_1.jpg"
body = """
Kennedy y Jrushchov no querían una guerra nuclear e hicieron casi todo lo posible por evitarla. El peligro vino de lo que no controlaban: mandos locales que disparaban sin permiso, submarinos sin comunicación con Moscú, aviones perdidos, armas que el adversario ni sabía que existían [s3]. Jrushchov lo resumió poco después: «Esta vez estuvimos realmente al borde de la guerra» [s13].

De ahí salieron dos acuerdos. El 20 de junio de 1963 se creó la **línea directa** entre Washington y Moscú (era un teletipo, no un «teléfono rojo»), operativa desde el 30 de agosto [s23]. Y el 5 de agosto de 1963, Rusk, Gromyko y el británico lord Home firmaron en Moscú el **Tratado de Prohibición Parcial de Ensayos Nucleares**: prohibía las pruebas en la atmósfera, en el espacio y bajo el agua [s24, s25].

Mucho de lo que sabemos se conoció décadas después, con las cintas del ExComm, las actas del Presídium y conferencias con veteranos de los tres países [s5, s10]. Por eso conviene desconfiar de algunas leyendas: Robert Kennedy no fue la «paloma» constante que pintan sus memorias, según el historiador Sheldon Stern, que transcribió las cintas [s30].

En las partidas que vas a ver, unos agentes de IA hacen de Kennedy y de Jrushchov (y, si se activan, consejeros inspirados en McNamara, Taylor, Thompson, Stevenson, Mikoyán, Malinovski y Dobrynin). Se enfrentan a las mismas decisiones reales: **qué responder al descubrimiento** (20 de octubre), **qué hacer con los barcos ante la cuarentena** (23 de octubre), **cómo reaccionar al derribo del U-2** (noche del 27) y **si aceptar el trato** (28 de octubre). La historia real es solo una de las salidas posibles.
"""

