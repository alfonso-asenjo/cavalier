side = "USSR"
role = "Ministro de Defensa, mariscal de la URSS"
summary = "Héroe de la Segunda Guerra Mundial, planificó la Operación Anadyr por encargo de Jrushchov [s13]."
stance = """
En mayo recibió el encargo de calcular la operación y en julio rubricó el tratado militar con Raúl Castro [s13]. Redactó la directiva de septiembre sobre las armas tácticas, que no firmó [s5]. El 22 de octubre creía que el discurso de Kennedy era una «maniobra electoral», pero frenó el uso nuclear [s13]. El 28 reprochó a Pliev haber sido «demasiado precipitado» al derribar el U-2 [s38]. Mikoyán dijo en 1974 que apoyaba a Jrushchov de forma «irresponsable e incondicional» [s33].
"""
key_moment = "La noche del 22 de octubre aconseja esperar y no dar al enemigo un pretexto para el uso atómico."
in_game = true
photo = "persona_malinovsky.jpg"
evidence = "documento"

[[people]]
id = "gromyko"
name = "Andréi Gromyko"
side = "USSR"
role = "Ministro de Asuntos Exteriores"
summary = "Diplomático disciplinado; ejecutaba más que proponía [s13]."
stance = """
El 18 de octubre se reunió con Kennedy sin saber que EE. UU. ya había visto los misiles, habló solo de armas «defensivas» y cablegrafió que la situación era «completamente satisfactoria» [s14]. Jrushchov admitió que mintió por orden del partido [s13]. El 28 indicó a Dobrynin que dijera a RFK que su mensaje tenía comprensión en Moscú [s14]. En agosto de 1963 firmó el tratado de prohibición de ensayos [s24].
"""
key_moment = "El 18 de octubre niega ante Kennedy la existencia de armas ofensivas en Cuba."
in_game = false
photo = "persona_gromyko.jpg"
evidence = "documento"

[[people]]
id = "dobrynin"
name = "Anatoli Dobrynin"
side = "USSR"
role = "Embajador soviético en Washington"
summary = "Diplomático soviético en Washington que se convirtió en el canal secreto con Robert Kennedy [s10]."
stance = """
Según sus memorias (sin confirmar en documentos), ni siquiera él sabía del despliegue antes del 22. El 27 transmitió con precisión la oferta de RFK y sus advertencias, subrayando que era «una petición, y no un ultimátum» [s10, s14]. En 1989 reveló en público aquella reunión, que obligó a admitir el trato [s12].
"""
key_moment = "Su cable sobre la reunión del 27 llega al Presídium el 28; se discute si antes o después de que Jrushchov decidiera aceptar [s13]."
in_game = true
photo = "persona_dobrynin.jpg"
evidence = "documento"

[[people]]
id = "feklisov"
name = "Aleksandr Feklisov («Fomin»)"
side = "USSR"
role = "Jefe de la estación del KGB en Washington"
summary = "Espía soviético que el 26 de octubre se reunió con el periodista de ABC John Scali [s1, s14]."
stance = """
Sus conversaciones con Scali giraron en torno a una fórmula: retirar los misiles a cambio de no invadir Cuba [s1]. Su cable al KGB presenta a Scali como quien la sugirió, y a sí mismo respondiendo con amenazas sobre Berlín; sus memorias, contradichas por esos archivos, lo cuentan de otro modo. Fursenko y Naftali concluyen que no está claro quién la propuso, pero sí que no salió de Moscú [s14]. Moscú no sabía de ese canal y su informe llegó tarde [s14]. Washington lo creyó decisivo; hoy se considera secundario [s14].
"""
key_moment = "El 26 de octubre abre con Scali un canal paralelo que nadie en Moscú le había encargado."
in_game = false
photo = "persona_feklisov.jpg"
evidence = "documento"

[[people]]
id = "castro"
name = "Fidel Castro"
side = "CUBA"
role = "Primer ministro de Cuba"
summary = "Líder de la revolución de 1959, de 36 años, convencido de que EE. UU. volvería a intentar derrocarle [s2]."
stance = """
Aceptó los misiles porque reequilibraban la balanza mundial, no solo para defender Cuba [s20], y creía que habían venido para quedarse [s13]. Ordenó a su antiaérea disparar contra los vuelos bajos y convenció a los generales soviéticos de encender los radares [s6, s8]. En su carta del 27 veía la invasión casi inevitable y justificaba en ese caso un golpe nuclear [s13]. El 28 no fue consultado; rechazó la inspección y quiso quedarse con las armas tácticas [s5]. Lo que más le ofendió fue que Jrushchov le acusara de querer una guerra nuclear [s13].
"""
key_moment = "La madrugada del 27 de octubre dicta su carta a Jrushchov en la embajada soviética."
in_game = false
photo = "persona_castro.jpg"
evidence = "documento"

[[people]]
id = "arjipov"
name = "Vasili Arjípov"
side = "USSR"
role = "Jefe de estado mayor de la 69.ª brigada de submarinos, a bordo del B-59"
summary = "Oficial de la Marina soviética que, según varios tripulantes, evitó que se lanzara un torpedo nuclear [s7]."
stance = """
Según el relato de Ketov, desde la torreta vio que los estadounidenses hacían señales y no atacaban, y calmó al capitán Savitski [s7]. Todo descansa en testimonios tardíos; su única intervención pública (1997) confirma el incidente de forma implícita, pero no describe su papel [s7].
"""
key_moment = "La tarde del 27 de octubre, en la torreta del B-59, convence al capitán de emerger en lugar de disparar."
in_game = false
photo = "persona_arjipov.jpg"
evidence = "memorias"

