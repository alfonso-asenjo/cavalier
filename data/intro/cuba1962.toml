# =============================================================================== momentos al límite

[[near_miss]]
date = "1962-10-22"
title = "¿Quién podía apretar el botón táctico?"
text = """
Un borrador de directiva del 8 de septiembre habría permitido a los mandos soviéticos en Cuba usar las armas tácticas si perdían el contacto con Moscú, pero Malinovski nunca lo firmó; el general Gribkov contó después que hubo una autorización verbal, retirada horas antes del discurso de Kennedy [s5]. Las órdenes del 22 y del 27 de octubre exigían permiso expreso de Moscú [s5]. Aun así, nada impedía técnicamente que los mandos locales las usaran ante una invasión [s3]. Lo que hubo antes del 22 sigue discutido.
"""
evidence = "disputado"
sources = ["s5", "s3", "s13"]

[[near_miss]]
date = "1962-10-26"
title = "Un misil de prueba en plena crisis"
text = """
A las 4:00 del 26 de octubre, la Fuerza Aérea lanzó desde Vandenberg (California) un ICBM Atlas de prueba que estaba programado, mientras alrededor se cargaban cabezas nucleares en otros misiles. Se lanzó sin nuevas órdenes de Washington y sin que los dirigentes lo supieran [s3].
"""
evidence = "documentado"
sources = ["s3"]

[[near_miss]]
date = "1962-10-26"
title = "Ojivas junto a los lanzadores"
text = """
Según documentos soviéticos, el 26 de octubre las cabezas nucleares llegaron a los emplazamientos de misiles y a los lanzadores tácticos, listas para usarse el 27. Una ojiva de misil de crucero FKR estaba desplegada a unos 24 km (15 millas) de la base estadounidense de Guantánamo. La inteligencia de EE. UU. nunca lo detectó [s6].
"""
evidence = "documentado"
sources = ["s6"]

[[near_miss]]
date = "1962-10-27"
title = "El derribo de Anderson"
text = """
Un misil antiaéreo soviético derribó el U-2 del mayor Rudolf Anderson, que murió. El derribo está documentado; la cadena de decisión se conoce por el testimonio del general Garbuz: él y el general Grechko lo autorizaron sin poder hablar con Pliev ni con Moscú [s8]. Jrushchov comprendió que no controlaba a sus propios mandos [s6]. En Washington, Taylor pidió atacar la batería; Kennedy no lo decidió y solo aceptó responder si volvían a disparar contra los aviones de reconocimiento [s19].
"""
evidence = "documentado"
sources = ["s8", "s6", "s19"]

[[near_miss]]
date = "1962-10-27"
title = "Un U-2 perdido sobre la URSS"
text = """
El U-2 del capitán Maultsby, en una misión de muestreo de aire cerca del Polo Norte, se desorientó y entró en territorio soviético. Despegaron cazas MiG para interceptarlo y, desde Alaska, dos F-102 armados con misiles aire-aire nucleares [s9, s6]. El 28, Jrushchov escribió a Kennedy que el intruso podía haberse confundido «fácilmente» con «un bombardero nuclear, lo que podría empujarnos a un paso fatal» [s9].
"""
evidence = "documentado"
sources = ["s9", "s6"]

[[near_miss]]
date = "1962-10-27"
title = "El submarino B-59 y Vasili Arjípov"
text = """
Los diarios de navegación estadounidenses documentan el acoso con cargas de profundidad de práctica y la emersión del B-59, que llevaba un torpedo nuclear [s7]. Que el capitán Savitski ordenara preparar ese torpedo y que Arjípov, jefe de estado mayor de la brigada, le calmara procede de testimonios tardíos de tripulantes (Orlov, Ketov y otros); la única declaración pública de Arjípov (1997) no detalla su propio papel [s7]. La famosa regla de que hacían falta tres oficiales para lanzar no aparece en el dossier del National Security Archive [s7].
"""
evidence = "testimonios"
sources = ["s7", "s3"]

[[near_miss]]
date = "1962-10-27"
title = "La carta de Castro"
text = """
En la madrugada del 27, en la embajada soviética, Castro dictó una carta a Jrushchov: la agresión era «casi inevitable» y, si EE. UU. invadía, un golpe nuclear sería «la más legítima defensa propia» [s13]. El National Security Archive la lee como una recomendación de golpe preventivo [s6]; los cubanos sostienen que solo se refería al caso de una invasión [s13]. Jrushchov dijo después: «Nos quedamos completamente horrorizados» [s13].
"""
evidence = "documentado"
sources = ["s13", "s6"]

[[near_miss]]
date = "1962-10-28"
title = "¿Una orden de lanzamiento en Okinawa?"
text = """
John Bordne, que sirvió en una base de misiles de crucero Mace en Okinawa, afirma que la noche del 28 de octubre (hora local) las tripulaciones recibieron por error una orden cifrada de lanzar sus misiles nucleares, y que el capitán William Bassett se negó hasta que se anuló. El relato descansa en un solo testigo y en un veterano anónimo; no se han encontrado registros, y varios misileros de la Fuerza Aérea lo han negado [s22]. Además, Norris solo cuenta 16 misiles Mace en Okinawa, frente a los 32 del relato [s3].
"""
evidence = "disputado"
sources = ["s22", "s3"]

