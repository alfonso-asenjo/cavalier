# pasar el ratón o al tocarlo. `match`: formas en las que aparece (sin distinguir mayúsculas).
[[glossary]]
term = "Guerra Fría"
match = ["Guerra Fría"]
def = "El enfrentamiento entre Estados Unidos y la Unión Soviética desde el final de la Segunda Guerra Mundial hasta 1991. Fue «fría» porque nunca se atacaron directamente: competían con armas, propaganda, espionaje y guerras en otros países."

[[glossary]]
term = "halcón"
match = ["halcón", "halcones"]
def = "En política, el partidario de la línea dura: presión militar, ataque aéreo o invasión. La pareja «halcones y palomas» se popularizó precisamente con esta crisis, en un artículo de diciembre de 1962 sobre el ExComm [s31]."

[[glossary]]
term = "paloma"
match = ["paloma", "palomas"]
def = "En política, el partidario de negociar y evitar el choque militar, aunque haya que ceder algo. Lo contrario de un halcón [s31]."

[[glossary]]
term = "canal secreto"
match = ["canal secreto", "canales secretos", "canal discreto"]
def = "Una vía de comunicación discreta, al margen de la diplomacia oficial y sin actas públicas. En la crisis, sobre todo las reuniones de Robert Kennedy con el embajador Dobrynin, donde se pactó en secreto la retirada de los Jupiter."

[[glossary]]
term = "ExComm"
match = ["ExComm"]
def = "Comité Ejecutivo del Consejo de Seguridad Nacional: el grupo de unos doce asesores que Kennedy reunió durante la crisis. Kennedy grabó en secreto sus reuniones, y por eso hoy se sabe lo que dijo cada uno."

[[glossary]]
term = "Presídium"
match = ["Presídium", "Presidium"]
def = "El órgano supremo del Partido Comunista de la Unión Soviética, que en la práctica gobernaba el país. Jrushchov lo presidía y en la crisis solía imponer su criterio."

[[glossary]]
term = "DEFCON"
match = ["DEFCON"]
def = "Escala de alerta de las fuerzas armadas estadounidenses, de 5 (paz) a 1 (guerra inminente). En la crisis se llegó a DEFCON 2 en el Mando Aéreo Estratégico, la única vez en la historia."

[[glossary]]
term = "ICBM"
match = ["ICBM", "misiles intercontinentales", "misil intercontinental"]
def = "Misil balístico intercontinental: puede cruzar de un continente a otro (más de 5.500 km) en unos 30 minutos. Sube fuera de la atmósfera y su ojiva cae sobre el objetivo."

[[glossary]]
term = "MRBM"
match = ["MRBM", "alcance medio"]
def = "Misil balístico de alcance medio (unos 1.000–3.000 km). Los R-12 soviéticos instalados en Cuba lo eran: desde allí llegaban a Washington."

[[glossary]]
term = "IRBM"
match = ["IRBM", "alcance intermedio"]
def = "Misil balístico de alcance intermedio (unos 3.000–5.500 km), como el R-14 soviético o el Jupiter estadounidense."

[[glossary]]
term = "SLBM"
match = ["SLBM"]
def = "Misil balístico lanzado desde un submarino, como el Polaris estadounidense. Es difícil de destruir por sorpresa porque el submarino se esconde bajo el agua."

[[glossary]]
term = "ojiva"
match = ["ojiva", "ojivas", "cabezas nucleares", "cabeza nuclear"]
def = "La carga explosiva que lleva un misil en la punta. «Ojiva nuclear» y «cabeza nuclear» significan lo mismo."

[[glossary]]
term = "megatón"
match = ["megatón", "megatones"]
def = "Unidad de potencia de una explosión: equivale a un millón de toneladas de TNT. La bomba de Hiroshima tuvo unos 15 kilotones, es decir, 0,015 megatones."

[[glossary]]
term = "kilotón"
match = ["kilotón", "kilotones"]
def = "Mil toneladas de TNT. Las armas nucleares tácticas de Cuba tenían de 2 a 14 kilotones: menos que la bomba de Hiroshima, pero suficiente para destruir una flota de desembarco."

[[glossary]]
term = "armas nucleares tácticas"
match = ["armas nucleares tácticas", "armas tácticas", "nucleares tácticas"]
def = "Armas nucleares pequeñas, pensadas para el campo de batalla (contra barcos, tropas o una playa de desembarco), no para destruir ciudades lejanas."

[[glossary]]
term = "cuarentena"
match = ["cuarentena"]
def = "El nombre que Kennedy dio a su bloqueo naval: los barcos de EE. UU. inspeccionaban los buques que iban a Cuba y no dejaban pasar armas ofensivas. Se evitó la palabra «bloqueo» porque legalmente es un acto de guerra."

[[glossary]]
term = "SAC"
match = ["SAC", "Mando Aéreo Estratégico"]
def = "Strategic Air Command, el Mando Aéreo Estratégico de EE. UU.: los bombarderos y misiles nucleares de largo alcance. Lo dirigía el general Thomas Power."

[[glossary]]
term = "U-2"
match = ["U-2"]
def = "Avión espía estadounidense que volaba a más de 20 km de altura y fotografiaba el terreno. Sus fotos descubrieron los misiles; uno fue derribado sobre Cuba el 27 de octubre."

[[glossary]]
term = "Jupiter"
match = ["Jupiter"]
def = "Misil estadounidense de alcance intermedio, de combustible líquido, instalado en Italia y en Turquía. Desde Turquía podía alcanzar Moscú."

[[glossary]]
term = "OTAN"
match = ["OTAN"]
def = "La alianza militar de Estados Unidos, Canadá y los países de Europa occidental, entre ellos Turquía e Italia."

[[glossary]]
term = "OEA"
match = ["Organización de Estados Americanos", "OEA"]
def = "La Organización de Estados Americanos, que reúne a los países de América. Su apoyo dio cobertura legal a la cuarentena."

# «Cómo funciona por dentro»: el simulador explicado para el público (datos de docs/PLAN.md).
[[how]]
title = "Dos agentes de IA, uno por líder"
body = """
Cada líder lo interpreta un **agente de IA**: un modelo de lenguaje (por defecto Qwen 3.5, de 9.000 millones de parámetros, que funciona en un ordenador normal con una tarjeta gráfica de 8 GB; también GPT o Claude) dentro de un pequeño programa con tres pasos: preparar la situación, deliberar y validar la respuesta.

Cada turno equivale a **12 horas** de la crisis. Al empezarlo, el agente recibe un informe con lo que su líder podría saber en ese momento: el estado de sus fuerzas, una estimación de las del rival (con errores y sesgos, como la inteligencia de verdad), informes que a veces son falsos, los mensajes que le han llegado y un resumen de sus seis últimas decisiones. Los dos líderes deciden a la vez, sin conocer la decisión del otro.

Responde con una ficha cerrada: hasta **tres acciones** de una lista (poner la cuarentena, subir la alerta, proponer un acuerdo, enviar un mensaje, ordenar contención a sus mandos…), un razonamiento de tres frases como máximo y cuánta confianza tiene. Si la respuesta no es válida se le pide que la corrija; si vuelve a fallar, ese turno su bando espera.
"""

[[how]]
title = "Qué inteligencia tienen"
body = """
Un modelo de lenguaje no piensa como una persona: predice el texto más plausible a partir de todo lo que leyó al entrenarse. No consulta internet, no recuerda las partidas anteriores y no tiene una estrategia propia: imita cómo razonaría alguien en esa situación. Sus respuestas tienen algo de azar, así que dos partidas que empiezan igual pueden acabar de forma distinta.

A cada agente se le pide que actúe «según la doctrina, los intereses y el estilo de decisión documentados» de su dirigente. El proyecto ha medido si eso sirve: con los nombres reales, el modelo «acierta» justo en las decisiones más famosas (la cuarentena, la aceptación de Jrushchov), porque **recuerda** cómo acabó; con los nombres ocultos, no reproduce ninguna decisión histórica por encima del azar. Es decir, **no razona como los dirigentes de 1962**: es un actor que improvisa con la información que le dan.
"""

[[how]]
title = "Cómo se ocultan los datos reales"
body = """
Si el agente sabe que esto es Cuba en 1962, sabe cómo acabó. Por eso juega en **modo anonimizado**: antes de que lea nada, un filtro cambia cada nombre por uno inventado. Estados Unidos es «la Federación Atlántica», la URSS es «la Unión Oriental», Kennedy es «el Presidente», Cuba es «la Isla», Turquía es «el Estado fronterizo» y las fechas pasan a ser «Día 12, 20:00». Un test comprueba en cada cambio del código que no se cuela ningún nombre real.

Renombrar no basta: una isla junto a una superpotencia, misiles en secreto y un bloqueo naval delatan el episodio, y el modelo de 9.000 millones de parámetros llega a reconocerlo. Por eso hay **escenarios trampa**. En uno no existen los misiles de Turquía: si el agente los pide, está recordando la historia, no razonando sobre lo que tiene delante. También hay una **sonda** que pregunta directamente al modelo si reconoce el episodio.

Esta web hace lo contrario solo para quien mira: al reproducir una partida devuelve los nombres y las fechas reales. Los agentes nunca los ven.
"""

[[how]]
title = "El motor: lo que decide qué pasa"
body = """
Las acciones no tienen efecto por sí mismas: las aplica un **motor de reglas** con supuestos escritos y visibles (`rules.toml`). Cada acción cambia unas variables (tensión, nivel de alerta, movilización, presión interna, credibilidad). Cada turno pueden ocurrir **incidentes** que ningún líder ordena (un avión derribado, un submarino acosado, una alerta transmitida sin cifrar), con una probabilidad que sube con la tensión y baja con la disciplina de los mandos. Un acuerdo no acaba la crisis: cada parte tiene un plazo para cumplir y la otra tiene que poder verificarlo.

Una partida termina con un acuerdo cumplido, con la crisis desactivada sin acuerdo, sin resolver cuando se acaba el tiempo, en guerra convencional o con el uso de un arma nuclear. Esas cifras dependen de los supuestos del motor, que se han medido con análisis de sensibilidad: **describen cómo se comportan estos agentes en este motor, no la probabilidad real de una guerra en 1962**.
"""

[[how]]
title = "Partidas que empiezan a mitad de la historia"
body = """
Una partida puede empezar el 16 de octubre o en un momento clave posterior: el 20, el 23, la noche del Sábado Negro o el 28. En ese caso el motor reconstruye el estado de ese momento siguiendo lo que ocurrió de verdad hasta entonces, con sus incidentes, y a partir de ahí deciden los agentes. Además se puede cambiar una sola cosa respecto a la historia (sin canal secreto, sin armas tácticas en Cuba, mandos más indisciplinados…) para ver cuánto pesa.
"""

[[how]]
title = "Consejeros"
body = """
En 1962 nadie decidía solo, aunque Jrushchov se acercó bastante. El siguiente experimento añade a siete **consejeros** históricos (McNamara, Taylor, Thompson y Stevenson con Kennedy; Mikoyán, Malinovski y Dobrynin con Jrushchov), cada uno con una ficha basada en las grabaciones del ExComm, las actas y los historiadores: su postura, sus líneas rojas y qué le haría cambiar de opinión.

La primera prueba ya está hecha, y muestra que con solo el nombre todos aconsejan casi lo mismo: el modelo no sabe quién era cada uno. Con su ficha, cada uno defiende lo que defendió en la realidad (Taylor pide el ataque aéreo en 117 de 120 consejos). También se vio que los consejeros moderados son los que más se pliegan a lo que el líder ya quiere hacer. Se pueden activar al simular una partida nueva; las partidas de ejemplo no los llevan.
"""
